{% if tags %}
<div class="card mb-3">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-tags"></i> Популярные теги</h5>
    </div>
    <div class="card-body">
        <div class="d-flex flex-wrap gap-2">
            {% for tag in tags %}
            <a href="{% url 'catalog:books_by_tag' tag.slug %}" class="tag-fix">
                ТЕСТ ТЕКСТА
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
